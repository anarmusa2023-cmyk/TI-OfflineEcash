name: P422 quorum tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: protocol
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "cryptography>=46,<47" "pytest>=8,<9"
      - run: pytest -q test_quorum_v1.py test_quorum_guard.py
